<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>擲筊模擬器 · 擲筊シミュレーター · Jiaobei Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --temple-red: #9c1c1c;
    --deep-red: #6b0f0f;
    --gold: #d4a84b;
    --light-gold: #f0d78c;
    --wood: #8b5a2b;
    --wood-light: #c4a574;
    --cream: #f8f0e3;
    --ink: #2c1e12;
    --paper: #fff8ef;
    --shadow: rgba(60, 20, 10, 0.35);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
    background: linear-gradient(165deg, #3a0a0a 0%, #5c1212 40%, #2a0808 100%);
    min-height: 100vh;
    color: var(--ink);
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12px;
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: var(--paper);
    border-radius: 16px;
    box-shadow:
      0 0 0 4px var(--gold),
      0 0 0 8px var(--deep-red),
      0 20px 50px var(--shadow);
    overflow: hidden;
    position: relative;
  }

  /* 頂部裝飾 */
  .header-bar {
    background: linear-gradient(90deg, var(--deep-red), var(--temple-red), var(--deep-red));
    padding: 14px 16px 18px;
    text-align: center;
    position: relative;
    border-bottom: 3px solid var(--gold);
  }

  .header-bar::before,
  .header-bar::after {
    content: "✦";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--light-gold);
    font-size: 1.1rem;
    opacity: 0.8;
  }
  .header-bar::before { left: 18px; }
  .header-bar::after { right: 18px; }

  h1 {
    font-family: 'Noto Serif TC', serif;
    color: var(--light-gold);
    font-size: 1.55rem;
    letter-spacing: 0.12em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    margin-bottom: 4px;
  }

  .subtitle {
    color: rgba(240, 215, 140, 0.85);
    font-size: 0.78rem;
    letter-spacing: 0.05em;
  }

  /* 語言切換 */
  .lang-switch {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 12px 16px 0;
  }

  .lang-btn {
    border: 1.5px solid var(--gold);
    background: transparent;
    color: var(--deep-red);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }

  .lang-btn.active {
    background: var(--temple-red);
    color: var(--light-gold);
    border-color: var(--temple-red);
    box-shadow: 0 2px 8px rgba(156, 28, 28, 0.3);
  }

  .lang-btn:hover:not(.active) {
    background: rgba(156, 28, 28, 0.08);
  }

  /* 說明區 */
  .instruction {
    padding: 16px 22px 8px;
    text-align: center;
    font-size: 0.92rem;
    line-height: 1.65;
    color: #4a3525;
  }

  .instruction .note {
    display: block;
    margin-top: 6px;
    font-size: 0.78rem;
    color: #8a6a4a;
  }

  /* 祭壇區域 */
  .altar {
    margin: 12px 18px;
    background: linear-gradient(180deg, #f5e6d0 0%, #e8d4b8 100%);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 20px 16px 28px;
    position: relative;
    box-shadow: inset 0 0 30px rgba(139, 90, 43, 0.12);
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .altar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      var(--temple-red) 0px,
      var(--temple-red) 12px,
      var(--gold) 12px,
      var(--gold) 24px
    );
    border-radius: 10px 10px 0 0;
  }

  /* 筊杯容器 */
  .jiao-area {
    display: flex;
    gap: 36px;
    justify-content: center;
    align-items: flex-end;
    height: 140px;
    position: relative;
    width: 100%;
  }

  .jiao {
    width: 72px;
    height: 48px;
    position: relative;
    transform-origin: center bottom;
    transition: none;
  }

  .jiao svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }

  .jiao.flat svg .face {
    fill: #c9a06a;
  }

  .jiao.curved svg .face {
    fill: #8b5a2b;
  }

  /* 擲出動畫 */
  .jiao.throwing {
    animation: throwAnim 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  .jiao.throwing:nth-child(2) {
    animation-delay: 0.08s;
  }

  @keyframes throwAnim {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 1;
    }
    20% {
      transform: translateY(-90px) rotate(180deg) scale(1.05);
    }
    45% {
      transform: translateY(-40px) rotate(360deg) scale(0.98);
    }
    70% {
      transform: translateY(-10px) rotate(520deg) scale(1.02);
    }
    100% {
      transform: translateY(0) rotate(720deg) scale(1);
    }
  }

  /* 結果文字 */
  .result-box {
    margin-top: 18px;
    text-align: center;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .result-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }

  .result-title.sheng { color: #1a6b3a; }
  .result-title.yin { color: #8b1a1a; }
  .result-title.xiao { color: #8a6a1a; }

  .result-desc {
    font-size: 0.88rem;
    color: #5a4535;
    line-height: 1.5;
  }

  .result-config {
    font-size: 0.75rem;
    color: #9a7a5a;
    margin-top: 4px;
  }

  /* 按鈕 */
  .btn-area {
    padding: 8px 22px 20px;
    text-align: center;
  }

  .throw-btn {
    background: linear-gradient(180deg, var(--temple-red) 0%, var(--deep-red) 100%);
    color: var(--light-gold);
    border: 2px solid var(--gold);
    padding: 14px 48px;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    border-radius: 40px;
    cursor: pointer;
    font-family: inherit;
    box-shadow:
      0 4px 0 #4a0a0a,
      0 6px 16px rgba(0,0,0,0.25);
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .throw-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 #4a0a0a,
      0 2px 8px rgba(0,0,0,0.2);
  }

  .throw-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .throw-btn::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      45deg,
      transparent 40%,
      rgba(255,255,255,0.12) 50%,
      transparent 60%
    );
    transform: rotate(25deg);
    pointer-events: none;
  }

  /* 歷史 */
  .history {
    padding: 0 22px 16px;
    text-align: center;
  }

  .history-title {
    font-size: 0.78rem;
    color: #9a7a5a;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }

  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    min-height: 28px;
  }

  .hist-item {
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 12px;
    background: #f0e4d0;
    color: #5a4535;
  }

  .hist-item.sheng { background: #d4edda; color: #1a6b3a; }
  .hist-item.yin { background: #f8d7da; color: #8b1a1a; }
  .hist-item.xiao { background: #fff3cd; color: #8a6a1a; }

  /* 底部文化說明 */
  .footer {
    background: linear-gradient(180deg, #f0e4d0, #e8d4b8);
    border-top: 2px solid var(--gold);
    padding: 14px 20px 18px;
    text-align: center;
    font-size: 0.75rem;
    color: #6a5040;
    line-height: 1.6;
  }

  .footer strong {
    color: var(--deep-red);
  }

  /* 響應式 */
  @media (max-width: 400px) {
    h1 { font-size: 1.3rem; }
    .jiao { width: 60px; height: 40px; }
    .jiao-area { gap: 24px; height: 120px; }
    .throw-btn { padding: 12px 36px; font-size: 1.05rem; }
    .altar { min-height: 190px; }
  }

  @media (min-width: 600px) {
    body { padding: 24px; }
    .container { max-width: 560px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h1 id="main-title">擲筊シミュレーター</h1>
      <div class="subtitle" id="sub-title">国際文化交流イベント * 伝統文化を体験する</div>
    </div>

    <div class="lang-switch">
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn active" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>

    <div class="instruction">
      <span id="instruction-text">下のボタンを押して筊を投げ、神様のご意志をお尋ねください。</span>
      <span class="note" id="instruction-note">聖筊＝許可　陰筊＝不許　笑筊＝再問</span>
    </div>

    <div class="altar">
      <div class="jiao-area" id="jiao-area">
        <div class="jiao" id="jiao1">
          <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
            <path class="face" d="M10,35 Q10,10 50,8 Q90,10 90,35 Q90,60 50,62 Q10,60 10,35 Z" fill="#8b5a2b"/>
            <path d="M20,35 Q20,18 50,16 Q80,18 80,35" fill="none" stroke="#6b4420" stroke-width="1.5" opacity="0.5"/>
            <ellipse cx="50" cy="38" rx="18" ry="8" fill="#6b4420" opacity="0.25"/>
          </svg>
        </div>
        <div class="jiao" id="jiao2">
          <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
            <path class="face" d="M10,35 Q10,10 50,8 Q90,10 90,35 Q90,60 50,62 Q10,60 10,35 Z" fill="#8b5a2b"/>
            <path d="M20,35 Q20,18 50,16 Q80,18 80,35" fill="none" stroke="#6b4420" stroke-width="1.5" opacity="0.5"/>
            <ellipse cx="50" cy="38" rx="18" ry="8" fill="#6b4420" opacity="0.25"/>
          </svg>
        </div>
      </div>

      <div class="result-box" id="result-box">
        <div class="result-title" id="result-title"></div>
        <div class="result-desc" id="result-desc"></div>
        <div class="result-config" id="result-config"></div>
      </div>
    </div>

    <div class="btn-area">
      <button class="throw-btn" id="throw-btn">擲筊する</button>
    </div>

    <div class="history">
      <div class="history-title" id="history-title">最近の結果</div>
      <div class="history-list" id="history-list"></div>
    </div>

    <div class="footer">
      <span id="footer-text">擲筊は台湾・中国の伝統的な神意伺いの方法です。<strong>聖筊</strong>（一正一反）は神様の許可、<strong>陰筊</strong>（両陰）は不許、<strong>笑筊</strong>（両陽）は笑って再問を促す意味を持ちます。</span>
    </div>
  </div>

<script>
const i18n = {
  ja: {
    title: "擲筊シミュレーター",
    subtitle: "伝統文化を体験する",
    instruction: "下のボタンを押して筊を投げ、神様のご意志をお尋ねください。",
    note: "聖筊＝許可　陰筊＝不許　笑筊＝再問",
    btn: "擲筊する",
    history: "最近の結果",
    footer: "擲筊は台湾・中国の伝統的な神意伺いの方法です。<strong>聖筊</strong>（一正一反）は神様の許可、<strong>陰筊</strong>（両陰）は不許、<strong>笑筊</strong>（両陽）は笑って再問を促す意味を持ちます。",
    sheng: "聖筊",
    yin: "陰筊",
    xiao: "笑筊",
    shengDesc: "神様がお許しになりました。願いが通じますように。",
    yinDesc: "神様はお許しになりません。時期を改めるか、別の方法をお考えください。",
    xiaoDesc: "神様がお笑いになりました。もう一度問い直すか、質問を変えてみてください。",
    configSheng: "一正一反（聖）",
    configYin: "両陰（不許）",
    configXiao: "両陽（笑）",
    waiting: "神意を伺っています…"
  },
  zh: {
    title: "擲筊模擬器",
    subtitle: "感受傳統文化的趣味",
    instruction: "點擊下方按鈕擲筊，誠心請求神明指示。",
    note: "聖筊＝應允　陰筊＝不許　笑筊＝再問",
    btn: "擲筊",
    history: "最近結果",
    footer: "擲筊是台灣與中國傳統向神明請示的方式。<strong>聖筊</strong>（一正一反）代表神明應允，<strong>陰筊</strong>（兩陰）代表不許，<strong>笑筊</strong>（兩陽）則是神明一笑，建議再問或另請高明。",
    sheng: "聖筊",
    yin: "陰筊",
    xiao: "笑筊",
    shengDesc: "神明應允，所求之事可成。",
    yinDesc: "神明不許，宜改期或另覓良策。",
    xiaoDesc: "神明一笑，建議再擲一次或重新思考問題。",
    configSheng: "一正一反（聖）",
    configYin: "兩陰（不許）",
    configXiao: "兩陽（笑）",
    waiting: "正在請示神明…"
  },
  en: {
    title: "Jiaobei Simulator",
    subtitle: "Experience traditional temple culture",
    instruction: "Tap the button below to throw the jiaobei and seek divine guidance.",
    note: "Sheng = Yes　Yin = No　Xiao = Laugh / Unclear",
    btn: "Throw",
    history: "Recent results",
    footer: "Jiaobei (throwing moon blocks) is a traditional Taiwanese & Chinese way to consult the gods. <strong>Sheng</strong> (one flat, one curved) means approval, <strong>Yin</strong> (both curved) means refusal, and <strong>Xiao</strong> (both flat) is the gods laughing—try again or rephrase.",
    sheng: "Sheng (Yes)",
    yin: "Yin (No)",
    xiao: "Xiao (Laugh)",
    shengDesc: "The gods approve. May your wish be granted.",
    yinDesc: "The gods do not approve. Consider another time or approach.",
    xiaoDesc: "The gods laugh. Please throw again or rethink your question.",
    configSheng: "One flat, one curved",
    configYin: "Both curved (No)",
    configXiao: "Both flat (Laugh)",
    waiting: "Consulting the gods…"
  }
};

let currentLang = "ja";
let isThrowing = false;
const history = [];

const $ = id => document.getElementById(id);

function setLang(lang) {
  currentLang = lang;
  const t = i18n[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  $("main-title").textContent = t.title;
  $("sub-title").textContent = t.subtitle;
  $("instruction-text").textContent = t.instruction;
  $("instruction-note").textContent = t.note;
  $("throw-btn").textContent = t.btn;
  $("history-title").textContent = t.history;
  $("footer-text").innerHTML = t.footer;

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });

  // 更新當前結果文字（若有）
  const titleEl = $("result-title");
  if (titleEl.dataset.type) {
    updateResultText(titleEl.dataset.type);
  }
}

function updateResultText(type) {
  const t = i18n[currentLang];
  const titleEl = $("result-title");
  const descEl = $("result-desc");
  const configEl = $("result-config");

  titleEl.dataset.type = type;
  titleEl.className = "result-title " + type;

  if (type === "sheng") {
    titleEl.textContent = t.sheng;
    descEl.textContent = t.shengDesc;
    configEl.textContent = t.configSheng;
  } else if (type === "yin") {
    titleEl.textContent = t.yin;
    descEl.textContent = t.yinDesc;
    configEl.textContent = t.configYin;
  } else {
    titleEl.textContent = t.xiao;
    descEl.textContent = t.xiaoDesc;
    configEl.textContent = t.configXiao;
  }
}

function setJiaoSide(el, isFlat) {
  el.classList.toggle("flat", isFlat);
  el.classList.toggle("curved", !isFlat);
}

function throwJiao() {
  if (isThrowing) return;
  isThrowing = true;
  const btn = $("throw-btn");
  btn.disabled = true;

  const t = i18n[currentLang];
  $("result-title").textContent = "";
  $("result-desc").textContent = t.waiting;
  $("result-config").textContent = "";
  $("result-title").className = "result-title";
  $("result-title").dataset.type = "";

  const j1 = $("jiao1");
  const j2 = $("jiao2");

  j1.classList.remove("throwing");
  j2.classList.remove("throwing");
  void j1.offsetWidth; // reflow
  j1.classList.add("throwing");
  j2.classList.add("throwing");

  // 隨機結果
  const side1 = Math.random() < 0.5; // true = flat
  const side2 = Math.random() < 0.5;

  setTimeout(() => {
    setJiaoSide(j1, side1);
    setJiaoSide(j2, side2);

    let type;
    if (side1 !== side2) type = "sheng";
    else if (side1 && side2) type = "xiao"; // both flat
    else type = "yin"; // both curved

    updateResultText(type);

    // 歷史
    history.unshift(type);
    if (history.length > 8) history.pop();
    renderHistory();

    j1.classList.remove("throwing");
    j2.classList.remove("throwing");
    isThrowing = false;
    btn.disabled = false;
  }, 1150);
}

function renderHistory() {
  const list = $("history-list");
  list.innerHTML = "";
  const t = i18n[currentLang];
  history.forEach(type => {
    const span = document.createElement("span");
    span.className = "hist-item " + type;
    span.textContent = type === "sheng" ? t.sheng : type === "yin" ? t.yin : t.xiao;
    list.appendChild(span);
  });
}

// 事件
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

$("throw-btn").addEventListener("click", throwJiao);

// 初始
setLang("ja");
setJiaoSide($("jiao1"), true);
setJiaoSide($("jiao2"), false);
</script>
</body>
</html>
